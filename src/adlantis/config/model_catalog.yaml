# Facts about models, shared by every routing profile (models*.yaml).
# Profiles pick models for roles; this file records what each model accepts
# and costs. A profile may override an entry by defining the same key itself.
#
# capabilities:
#   efforts             accepted reasoning_effort values (null = not checked)
#   default_effort      what the API uses when effort is omitted
#   temperature_efforts effort levels at which `temperature` is accepted;
#                       [] means never
#   tier                capability rank within one provider (higher = stronger);
#                       not comparable across providers. Roles that need strong
#                       reasoning or writing require tier >= 2.
# Models not listed here are not validated.

capabilities:
  # --- OpenAI (checked 2026-11-18) ------------------------------------------
  # https://developers.openai.com/api/docs/models/<model-id>
  # The 6.2 line rejects reasoning effort `none`, and GPT-6 models accept
  # temperature only at effort `none`, so the 6.2 line never accepts it.
  gpt-6.2-astra:
    provider: openai
    tier: 4
    efforts: [low, medium, high, xhigh, max]
    temperature_efforts: []
  gpt-6.2-sol:
    provider: openai
    tier: 3
    efforts: [low, medium, high, xhigh, max]
    temperature_efforts: []
  gpt-6.1-terra:
    provider: openai
    tier: 2
    efforts: [none, low, medium, high, xhigh, max]
    default_effort: medium
    temperature_efforts: [none]
  gpt-6-luna:
    provider: openai
    tier: 1
    efforts: [none, low, medium, high, xhigh, max]
    default_effort: medium
    temperature_efforts: [none]

  # --- Anthropic (checked 2026-11-18) ---------------------------------------
  # https://platform.claude.com/docs/en/about-claude/models/overview
  # Sampling parameters return 400 on these models. Forced tool use is also
  # rejected, so the Anthropic provider uses structured outputs for structured().
  claude-opus-5-5:
    provider: anthropic
    tier: 3
    efforts: [low, medium, high, xhigh, max]
    default_effort: medium
    temperature_efforts: []
  claude-sonnet-5-5:
    provider: anthropic
    tier: 2
    efforts: [low, medium, high, xhigh, max]
    default_effort: high
    temperature_efforts: []

# USD per 1M tokens, standard tier, from the providers' pricing pages (2026-11-18).
# OpenAI prices are the short-context rates (up to 272K input tokens) with the 30-minute
# cache write; Anthropic cache writes are the 5-minute TTL.
pricing:
  gpt-6.2-astra: {input_per_mtok: 8.0, output_per_mtok: 40.0, cache_read_per_mtok: 0.40, cache_write_per_mtok: 10.0}
  gpt-6.2-sol: {input_per_mtok: 2.0, output_per_mtok: 10.0, cache_read_per_mtok: 0.10, cache_write_per_mtok: 2.5}
  gpt-6.1-terra: {input_per_mtok: 1.0, output_per_mtok: 5.0, cache_read_per_mtok: 0.05, cache_write_per_mtok: 1.25}
  gpt-6-luna: {input_per_mtok: 0.10, output_per_mtok: 0.50, cache_read_per_mtok: 0.01, cache_write_per_mtok: 0.125}
  claude-opus-5-5: {input_per_mtok: 4.0, output_per_mtok: 20.0, cache_read_per_mtok: 0.20, cache_write_per_mtok: 5.0}
  claude-sonnet-5-5: {input_per_mtok: 2.0, output_per_mtok: 10.0, cache_read_per_mtok: 0.10, cache_write_per_mtok: 2.5}
