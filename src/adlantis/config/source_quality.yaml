# Source-quality rules: where a source is published → a weight from 0 to 1.
# Recorded on each evidence record and reported by the evals. Override with
# SOURCE_QUALITY_PATH.
#
# Matching order for a URL's host (leading "www." ignored):
#   deny (→ 0, "blocked") → domains (longest match) → suffixes → default.
# A host matching no rule is "unrated" with the neutral default score: unknown is
# not the same as weak. Add domains here to rate them.
# A domain matches the host itself and any subdomain.

default: {score: 0.5, label: unrated web}

tiers:
  high: 0.75    # score >= 0.75 → high
  medium: 0.5   # score >= 0.5  → medium; below → low

# Content farms and link-spam hosts seen in research runs.
deny:
  - mybluehost.me
  - blogspot.com
  - wixsite.com
  - weebly.com

